name: logintegrite

# Les valeurs sensibles viennent du fichier .env (non versionne). Modele : .env.example

networks:
  logintegrite-net:

volumes:
  postgres_data:
  storage_data:

services:

  postgres:
    image: postgres:16
    container_name: logintegrite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logintegrite_db
      POSTGRES_USER: logintegrite_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Publie sur la boucle locale uniquement. 5433 cote hote : 5432 est souvent pris par un Postgres local.
      - "127.0.0.1:5433:5432"
    networks: [logintegrite-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logintegrite_user -d logintegrite_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: logintegrite-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: logintegrite_user
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD manquant dans .env}
      # Issuer identique pour le navigateur et le backend : http://localhost:8180
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Substitues dans logintegrite-realm.json a l'import
      KC_ADMIN_API_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET manquant dans .env}
      KC_TEST_USERS_PASSWORD: ${KC_TEST_USERS_PASSWORD:?KC_TEST_USERS_PASSWORD manquant dans .env}
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      - ./docker/keycloak/themes/asce-lc:/opt/keycloak/themes/asce-lc:ro
    networks: [logintegrite-net]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: .
    image: logintegrite-backend:latest
    container_name: logintegrite-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logintegrite_db
      SPRING_DATASOURCE_USERNAME: logintegrite_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Issuer = URL publique (claim "iss" du token) ; cles JWK lues via le reseau Docker
      JWT_ISSUER_URI: http://localhost:8180/realms/logintegrite
      JWT_JWK_SET_URI: http://keycloak:8080/realms/logintegrite/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      STORAGE_DIR: /app/storage/documents
    volumes:
      - storage_data:/app/storage
    networks: [logintegrite-net]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logintegrite-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@asce-lc.bf
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD manquant dans .env}
    ports:
      - "127.0.0.1:5050:80"
    networks: [logintegrite-net]
    depends_on:
      postgres:
        condition: service_healthy

spring.application.name=logintegrite-backend

# CONFIGURATION DE BASE (sure par defaut : production)
# Aucun secret ici. Les valeurs sensibles arrivent par variables d'environnement :
#   SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
#   KEYCLOAK_ADMIN_CLIENT_SECRET
# Developpement local : --spring.profiles.active=dev (voir application-dev.properties).

# BASE DE DONNEES
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE : le schema est gere par Flyway, Hibernate ne fait que valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=core
spring.flyway.schemas=core,audit,documents,dossiers,personnes,referentiels,securite

# SECURITE KEYCLOAK JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8180/realms/logintegrite}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8180/realms/logintegrite/protocol/openid-connect/certs}
logintegrite.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Audience attendue dans le claim "aud" (mapper d'audience du client Keycloak logintegrite-backend)
logintegrite.security.audience=${JWT_AUDIENCE:logintegrite-api}
# Derriere un reverse proxy de confiance (Caddy) : SERVER_FORWARD_HEADERS_STRATEGY=native

# KEYCLOAK ADMIN REST API (client confidentiel dedie)
keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8180}
keycloak.admin.realm=logintegrite
keycloak.admin.client-id=logintegrite-admin-api
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# SERVEUR
server.port=8080
server.shutdown=graceful
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# UPLOAD ET STOCKAGE DE FICHIERS
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
logintegrite.stockage.repertoire=${STORAGE_DIR:./storage/documents}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# DOCUMENTATION API (desactivee hors dev)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# LOGS
logging.level.root=INFO
logging.level.bf.gov.ascelc=INFO

spring.application.name=logintegrite-backend

# ── BASE DE DONNÉES ──────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/logintegrite_db
spring.datasource.username=logintegrite_user
spring.datasource.password=LogInt2026Secure
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / HIBERNATE 7 ────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# ── SÉCURITÉ KEYCLOAK JWT ────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/logintegrite
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/logintegrite/protocol/openid-connect/certs

# ── SERVEUR ───────────────────────────────────────
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ── UPLOAD FICHIERS ───────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── ACTUATOR ──────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── LOGS (Configuration de Débuggage Ciblée) ──────
logging.level.bf.gov.ascelc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

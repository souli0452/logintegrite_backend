# Profil de developpement local : --spring.profiles.active=dev
# Les secrets restent a fournir par variables d'environnement
# (SPRING_DATASOURCE_PASSWORD, KEYCLOAK_ADMIN_CLIENT_SECRET), jamais ici.
spring.datasource.url=jdbc:postgresql://localhost:5433/logintegrite_db
spring.datasource.username=logintegrite_user

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always

management.endpoint.health.show-details=always

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.bf.gov.ascelc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
